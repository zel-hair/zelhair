<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zel Hair | Video Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background: #f8f6f3;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #222;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        p {
            color: #777;
            margin-bottom: 30px;
        }

        .video-container {
            max-width: 850px;
            margin: auto;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            background: #000;
        }

        footer {
            margin-top: 35px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>

    <h1>ZEL HAIR</h1>
    <p>Video Compatibility Test</p>

    <div class="video-container">
        <video controls playsinline preload="metadata">
            <source src="hair-demo.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>
    </div>

    <footer>
        © 2026 Zel Hair
    </footer>

</body>
</html>
