<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zel Hair | Video Test</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #f5f2ed;
            color: #29251f;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 18px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            text-align: center;
        }

        .brand {
            font-size: 13px;
            letter-spacing: 6px;
            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(28px, 5vw, 48px);
            font-weight: 400;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .video-wrapper {
            width: 100%;
            background: #171717;
            border-radius: 8px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            min-height: 200px;
        }

        .status {
            margin-top: 20px;
            font-size: 13px;
            color: #777;
        }

        footer {
            margin-top: 45px;
            font-size: 11px;
            letter-spacing: 2px;
            color: #999;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="brand">ZEL HAIR</div>

        <h1>Beauty in Every Strand.</h1>

        <p class="subtitle">
            Video playback compatibility test.
        </p>

        <div class="video-wrapper">
            <video id="hairVideo" controls playsinline preload="metadata">
                <source src="./6BA7CF43-9D2A-4E49-9A4F-85B608AD2478.mp4" type="video/mp4">
                Your browser does not support this video.
            </video>
        </div>

        <p class="status" id="status">Loading video...</p>

        <footer>ZEL HAIR © 2026</footer>

    </main>

    <script>
        const video = document.getElementById("hairVideo");
        const status = document.getElementById("status");

        video.addEventListener("loadedmetadata", () => {
            status.textContent = "Video loaded successfully.";
        });

        video.addEventListener("error", () => {
            status.textContent = "Unable to load video. Check the file and encoding.";
        });
    </script>

</body>
</html>
